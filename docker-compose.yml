services:
  postgres:
    image: postgres:15
    container_name: file_saver_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d postgres
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  minio:
    image: minio/minio
    container_name: file_saver_minio
    command: server /data --address ":9001" --console-address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  file_saver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD} dbname=file_saver port=5432 sslmode=disable"
      ENDPOINT: "minio:9001"
      ACCESS_KEY_ID: "minioadmin"
      SECRET_ACCESS_KEY_ID: "minioadmin"
      USE_SSL: "false"
      BUCKET: "files"
      LOCATION: "us-east-1"
      JWT_SECRET: "${JWT_SECRET}"
      PORT: ${PORT}
    ports:
      - "4000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data: